name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, tipos, Vitest y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  base:
    name: Pruebas de la base (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest trae Postgres instalado (initdb, pg_ctl, psql); el script crea uno temporal.
      - run: bash scripts/probar-sql.sh

  # Pendiente (BITACORA 2026-11-20): Playwright en CI con `supabase start`.
  # Hoy corre en local contra la base de la nube (D-023).
