<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta del día · prototipo · Portal Mamut</title>
<!-- Prototipo de referencia para la Fase 1b. Ábrelo en el navegador (necesita internet para el mapa).
     No es código de la app: Claude Code lo usa para copiar el aspecto y el comportamiento.
     Los negocios son de ejemplo. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
  :root {
    --fondo:#FAF8F9; --superficie:#FFFFFF; --tinta:#1E1A1D; --tinta-suave:#6B6168; --borde:#E7E1E5;
    --ciruela:#6E2E5E; --ciruela-suave:#F3E8F0; --bien:#1F7A4D; --alerta:#A15C00; --error:#B3261E;
    --sombra: 0 10px 30px rgba(30,26,29,.14), 0 2px 6px rgba(30,26,29,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#151114; --superficie:#1F191D; --tinta:#F2EEF0; --tinta-suave:#A79DA4; --borde:#342B31;
      --ciruela:#C98BB8; --ciruela-suave:#3A2534; --bien:#5CC48E; --alerta:#E3A44F; --error:#F2857C;
      --sombra: 0 10px 30px rgba(0,0,0,.45); }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--fondo); color:var(--tinta);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased; }
  #mapa { position:fixed; inset:0; }
  .num { font-variant-numeric: tabular-nums; }

  /* Barra de arriba */
  .arriba { position:fixed; top:max(12px, env(safe-area-inset-top)); left:12px; right:12px; z-index:3;
    display:flex; gap:8px; align-items:center; }
  .pastilla { background:color-mix(in srgb, var(--superficie) 88%, transparent); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); border:1px solid var(--borde); border-radius:999px; box-shadow:var(--sombra);
    padding:10px 14px; display:flex; align-items:center; gap:10px; min-height:48px; }
  .titulo { flex:1; min-width:0; }
  .titulo b { display:block; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .titulo span { font-size:13px; color:var(--tinta-suave); }
  .redondo { width:48px; height:48px; border-radius:50%; border:1px solid var(--borde); display:grid; place-items:center;
    background:color-mix(in srgb, var(--superficie) 88%, transparent); backdrop-filter: blur(14px); box-shadow:var(--sombra);
    color:var(--tinta); cursor:pointer; }
  .redondo:active { transform:scale(.96); }

  /* Pines: el contenedor lo mueve MapLibre (usa transform), la gota va adentro */
  .pin { width:36px; height:44px; display:flex; align-items:flex-start; justify-content:center; cursor:pointer; }
  .gota { width:32px; height:32px; margin-top:2px; border-radius:50% 50% 50% 3px; transform:rotate(-45deg);
    background:var(--ciruela); border:3px solid var(--superficie); box-shadow:0 6px 14px rgba(110,46,94,.35);
    display:grid; place-items:center; transition: transform .2s ease, background .2s ease; position:relative; }
  .gota span { transform:rotate(45deg); color:#fff; font-weight:600; font-size:14px; font-variant-numeric:tabular-nums; }
  @media (prefers-color-scheme: dark) { .gota span { color:#151114; } }
  .pin.hecha .gota { background:var(--bien); }
  .pin.saltada .gota { background:var(--tinta-suave); opacity:.7; }
  .pin.activa .gota { transform:rotate(-45deg) scale(1.2); }
  .pin.siguiente .gota::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:2px solid var(--ciruela);
    animation: latido 1.8s ease-out infinite; }
  @keyframes latido { from { opacity:.8; transform:scale(.7);} to { opacity:0; transform:scale(1.5);} }
  .yo { width:18px; height:18px; border-radius:50%; background:#2F6FEB; border:3px solid #fff;
    box-shadow:0 0 0 6px rgba(47,111,235,.18); }

  /* Hoja inferior */
  .hoja { position:fixed; left:0; right:0; bottom:0; z-index:4; background:var(--superficie);
    border-radius:22px 22px 0 0; box-shadow:0 -12px 40px rgba(30,26,29,.16); border-top:1px solid var(--borde);
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); max-height:62vh; display:flex; flex-direction:column;
    transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .hoja.baja { transform: translateY(calc(100% - var(--visible, 270px))); }
  .agarre { width:40px; height:5px; border-radius:3px; background:var(--borde); margin:4px auto 10px; cursor:pointer; }
  .resumen { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .resumen h2 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .resumen p { margin:0; color:var(--tinta-suave); font-size:13px; }
  .barra { height:6px; border-radius:3px; background:var(--ciruela-suave); margin:10px 0 12px; overflow:hidden; }
  .barra i { display:block; height:100%; width:0; background:var(--ciruela); border-radius:3px; transition: width .25s ease; }
  .siguiente-card { display:flex; gap:12px; align-items:center; padding:12px; border-radius:14px; background:var(--ciruela-suave); }
  .siguiente-card .txt { flex:1; min-width:0; }
  .siguiente-card small { color:var(--ciruela); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .siguiente-card b { display:block; font-size:17px; font-weight:600; }
  .siguiente-card span { font-size:13px; color:var(--tinta-suave); }
  .btn { border:0; border-radius:10px; min-height:48px; padding:0 16px; font:600 15px/1 inherit; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; }
  .btn:active { transform:scale(.98); }
  .btn.principal { background:var(--ciruela); color:#fff; }
  @media (prefers-color-scheme: dark) { .btn.principal { color:#151114; } }
  .btn.suave { background:transparent; color:var(--tinta); border:1px solid var(--borde); }
  .acciones { display:flex; gap:8px; margin:12px 0 4px; }
  .acciones .btn { flex:1; }
  .lista { list-style:none; margin:8px 0 0; padding:0; overflow:auto; }
  .lista li { display:flex; gap:12px; align-items:center; padding:12px 2px; border-bottom:1px solid var(--borde); cursor:pointer; }
  .lista li:last-child { border-bottom:0; }
  .n { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:600;
    background:var(--ciruela-suave); color:var(--ciruela); flex:none; }
  .hecha .n { background:var(--bien); color:#fff; }
  .lista .txt { flex:1; min-width:0; }
  .lista b { display:block; font-size:15px; font-weight:500; }
  .lista span { font-size:13px; color:var(--tinta-suave); }
  .hecha b { text-decoration: line-through; color:var(--tinta-suave); }
  .chip { font-size:12px; padding:4px 8px; border-radius:999px; background:var(--fondo); border:1px solid var(--borde);
    color:var(--tinta-suave); white-space:nowrap; }
  .chip.caliente { color:var(--alerta); border-color:color-mix(in srgb, var(--alerta) 40%, var(--borde)); }
  .aviso { position:fixed; left:50%; top:76px; transform:translateX(-50%) translateY(-8px); opacity:0; z-index:5;
    background:var(--tinta); color:var(--fondo); padding:10px 14px; border-radius:12px; font-size:14px;
    transition: all .2s ease; pointer-events:none; }
  .aviso.ver { opacity:1; transform:translateX(-50%); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  @media (min-width: 900px) {
    .hoja { left:16px; right:auto; bottom:16px; top:84px; width:380px; border-radius:22px; max-height:none; }
    .hoja.baja { transform:none; } .agarre { display:none; }
    .arriba { right:auto; width:380px; }
  }
  .maplibregl-ctrl-attrib { font-size:10px; }
</style>
</head>
<body>
<div id="mapa" aria-label="Mapa de la ruta"></div>

<div class="arriba">
  <a class="redondo" href="#" aria-label="Volver">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <div class="pastilla titulo">
    <div><b>Chapinero · Cra 13</b><span>Martes 24 de noviembre · tarde</span></div>
  </div>
  <button class="redondo" id="centrar" aria-label="Ver toda la ruta">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
  </button>
</div>

<section class="hoja baja" id="hoja">
  <div class="agarre" id="agarre" role="button" aria-label="Subir o bajar la lista"></div>
  <div class="resumen">
    <h2><span class="num" id="hechas">0</span> de <span class="num" id="total">0</span> visitas</h2>
    <p class="num" id="km">—</p>
  </div>
  <div class="barra"><i id="progreso"></i></div>

  <div class="siguiente-card" id="sig">
    <div class="txt"><small>Siguiente</small><b id="sigNombre">—</b><span id="sigInfo">—</span></div>
    <a class="btn principal" id="ir" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="m3 11 19-9-9 19-2-8-8-2z"/></svg>Ir
    </a>
  </div>
  <div class="acciones">
    <button class="btn suave" id="ordenar">Ordenar por cercanía</button>
    <button class="btn suave" id="anotar">Anota la visita</button>
  </div>
  <ul class="lista" id="lista"></ul>
</section>
<div class="aviso" id="aviso"></div>

<script>
// ----- Datos de ejemplo (en la app vienen de v_ruta_paradas) -----
const paradas = [
  { id:'a', nombre:'Café Origen',        tipo:'Café de especialidad', dir:'Cra 13 # 57-10', lat:4.6440, lng:-74.0636, etapa:'Pidió propuesta' },
  { id:'b', nombre:'Panadería La Espiga',tipo:'Panadería',            dir:'Cra 13 # 39-22', lat:4.6280, lng:-74.0675, etapa:'Nuevo' },
  { id:'c', nombre:'Brunch Club 63',     tipo:'Brunch',               dir:'Cra 13 # 63-41', lat:4.6487, lng:-74.0627, etapa:'Volver otro día' },
  { id:'d', nombre:'Heladería Polar',    tipo:'Heladería',            dir:'Cra 13 # 45-08', lat:4.6336, lng:-74.0660, etapa:'Nuevo' },
  { id:'e', nombre:'Taquería El Patio',  tipo:'Restaurante',          dir:'Cra 13 # 51-30', lat:4.6390, lng:-74.0648, etapa:'Interesado' },
  { id:'f', nombre:'Pastelería Mora',    tipo:'Pastelería',           dir:'Calle 48 # 13-15', lat:4.6362, lng:-74.0668, etapa:'Nuevo' },
].map(p => ({ ...p, estado:'pendiente' }));
const yo = { lat:4.6272, lng:-74.0682 }; // en la app: navigator.geolocation (no se guarda)

// ----- Igual que lib/dominio/ruta.ts -----
const rad = g => g*Math.PI/180;
function dist(a,b){ const dLa=rad(b.lat-a.lat), dLo=rad(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;
  return 2*6371000*Math.asin(Math.min(1,Math.sqrt(h))); }
function ordenar(ps, inicio){ const pend=[...ps], out=[]; let act=inicio;
  while(pend.length){ let m=0,md=1e12; pend.forEach((p,i)=>{const d=dist(act,p); if(d<md){md=d;m=i;}});
    act=pend.splice(m,1)[0]; out.push(act); }
  let mejoro=true, n=0; const pt=i=>i<0?inicio:out[i];
  while(mejoro && n++<50){ mejoro=false;
    for(let i=-1;i<out.length-2;i++) for(let k=i+2;k<out.length;k++){
      const a=pt(i), b=out[i+1], c=out[k], d=out[k+1];
      const antes=dist(a,b)+(d?dist(c,d):0), desp=dist(a,c)+(d?dist(b,d):0);
      if(desp+0.01<antes){ out.splice(i+1,k-i,...out.slice(i+1,k+1).reverse()); mejoro=true; } } }
  return out; }
const irA = p => `https://www.google.com/maps/dir/?api=1&destination=${p.lat.toFixed(6)},${p.lng.toFixed(6)}&travelmode=walking`;
function resumen(ps){ const m=Math.round([yo,...ps].reduce((s,p,i,a)=>i?s+dist(a[i-1],p):0,0)*1.3);
  const min=Math.round(m/(4500/3600)/60);
  return `${(m/1000).toLocaleString('es-CO',{maximumFractionDigits:1})} km · ${min} min a pie`; }

// ----- Mapa -----
const oscuro = matchMedia('(prefers-color-scheme: dark)').matches;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const map = new maplibregl.Map({
  container:'mapa',
  style:`https://tiles.openfreemap.org/styles/${oscuro ? 'dark' : 'positron'}`,
  center:[-74.0655, 4.6380], zoom:14.6, attributionControl:{ compact:true },
});

let orden = [...paradas], marcadores = {}, activa = null;

function lineaGeo(){ return { type:'Feature', geometry:{ type:'LineString',
  coordinates:[yo, ...orden.filter(p=>p.estado!=='saltada')].map(p=>[p.lng,p.lat]) } }; }

map.on('load', () => {
  // Un toque de la paleta sobre el mapa base: agua y parques en tonos suaves.
  for (const l of map.getStyle().layers) {
    if (l.type==='background') map.setPaintProperty(l.id,'background-color', css('--fondo'));
    if (l.type==='fill' && /water/.test(l.id)) map.setPaintProperty(l.id,'fill-color', oscuro ? '#1d2630' : '#DCE7EE');
    if (l.type==='fill' && /park|landcover|grass|wood/.test(l.id)) map.setPaintProperty(l.id,'fill-color', oscuro ? '#1b2420' : '#E5EFE3');
  }
  map.addSource('ruta', { type:'geojson', data:lineaGeo() });
  map.addLayer({ id:'ruta-borde', type:'line', source:'ruta', layout:{'line-cap':'round','line-join':'round'},
    paint:{ 'line-color': css('--superficie'), 'line-width': 9 } });
  map.addLayer({ id:'ruta', type:'line', source:'ruta', layout:{'line-cap':'round','line-join':'round'},
    paint:{ 'line-color': css('--ciruela'), 'line-width': 5 } });
  // "Hormigas" que avanzan sobre la línea (ejemplo oficial de MapLibre). Se apaga con prefers-reduced-motion.
  map.addLayer({ id:'ruta-hormigas', type:'line', source:'ruta', layout:{'line-join':'round'},
    paint:{ 'line-color': css('--superficie'), 'line-width': 2, 'line-opacity': .85, 'line-dasharray':[0,4,3] } });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const seq = [[0,4,3],[0.5,4,2.5],[1,4,2],[1.5,4,1.5],[2,4,1],[2.5,4,0.5],[3,4,0],
      [0,0.5,3,3.5],[0,1,3,3],[0,1.5,3,2.5],[0,2,3,2],[0,2.5,3,1.5],[0,3,3,1],[0,3.5,3,0.5]];
    let paso = -1;
    const anim = (t) => { const s = Math.floor(t / 60) % seq.length;
      if (s !== paso) { map.setPaintProperty('ruta-hormigas', 'line-dasharray', seq[s]); paso = s; }
      requestAnimationFrame(anim); };
    requestAnimationFrame(anim);
  }
  const yoEl = document.createElement('div'); yoEl.className='yo';
  new maplibregl.Marker({ element:yoEl }).setLngLat([yo.lng, yo.lat]).addTo(map);
  pintar(); altoHoja(); encuadrar(false);
});

const ancho = () => innerWidth >= 900;
// Alto de la hoja que tapa el mapa (en celular, la hoja empieza baja: resumen, siguiente y botones).
function altoHoja(){
  const hoja = document.getElementById('hoja');
  if (ancho()) return 0;
  const visible = document.querySelector('.acciones').getBoundingClientRect().bottom - hoja.getBoundingClientRect().top + 14;
  hoja.style.setProperty('--visible', visible + 'px');
  return hoja.classList.contains('baja') ? visible : hoja.getBoundingClientRect().height;
}
function relleno(){ return ancho() ? { top:90, bottom:60, left:430, right:60 } : { top:90, bottom: altoHoja() + 24, left:50, right:50 }; }
function encuadrar(animar=true){
  const b = new maplibregl.LngLatBounds(); [yo,...orden].forEach(p=>b.extend([p.lng,p.lat]));
  map.fitBounds(b, { padding: relleno(), duration: animar ? 600 : 0, maxZoom:16.5 });
}

function pintar(){
  const pend = orden.filter(p=>p.estado==='pendiente');
  const sig = pend[0];
  // pines
  orden.forEach((p,i)=>{
    let m = marcadores[p.id];
    if (!m){ const el=document.createElement('div'); el.className='pin'; el.innerHTML='<div class="gota"><span></span></div>';
      el.addEventListener('click', ()=>enfocar(p.id));
      m = marcadores[p.id] = new maplibregl.Marker({ element:el, anchor:'bottom' }).setLngLat([p.lng,p.lat]).addTo(map); }
    const el = m.getElement();
    el.className = 'pin' + (p.estado==='visitada'?' hecha':'') + (p.estado==='saltada'?' saltada':'')
      + (sig && p.id===sig.id ? ' siguiente':'') + (activa===p.id?' activa':'');
    el.querySelector('span').textContent = p.estado==='visitada' ? '✓' : String(i+1);
    el.setAttribute('aria-label', `${i+1}. ${p.nombre}`);
  });
  if (map.getSource('ruta')) map.getSource('ruta').setData(lineaGeo());
  // resumen
  const hechas = orden.filter(p=>p.estado==='visitada').length;
  document.getElementById('hechas').textContent = hechas;
  document.getElementById('total').textContent = orden.length;
  document.getElementById('progreso').style.width = (100*hechas/orden.length)+'%';
  document.getElementById('km').textContent = resumen(pend);
  // siguiente
  const card = document.getElementById('sig');
  if (sig){ card.style.display='flex';
    document.getElementById('sigNombre').textContent = sig.nombre;
    const desde = orden[orden.indexOf(sig)-1]; const ref = desde && desde.estado==='visitada' ? desde : yo;
    document.getElementById('sigInfo').textContent = `${sig.dir} · ${Math.round(dist(ref,sig)*1.3/75)} min a pie`;
    document.getElementById('ir').href = irA(sig);
  } else { card.style.display='none'; }
  // lista
  const ul = document.getElementById('lista'); ul.innerHTML='';
  orden.forEach((p,i)=>{
    const li=document.createElement('li'); li.className = p.estado==='visitada' ? 'hecha':'';
    li.innerHTML = `<div class="n num">${p.estado==='visitada'?'✓':i+1}</div>
      <div class="txt"><b></b><span></span></div><span class="chip"></span>`;
    li.querySelector('b').textContent = p.nombre;
    li.querySelector('.txt span').textContent = `${p.tipo} · ${p.dir}`;
    const chip = li.querySelector('.chip'); chip.textContent = p.etapa;
    if (/propuesta|Interesado/.test(p.etapa)) chip.classList.add('caliente');
    li.addEventListener('click', ()=>enfocar(p.id));
    ul.appendChild(li);
  });
}

function enfocar(id){ activa=id; const p=orden.find(x=>x.id===id);
  map.easeTo({ center:[p.lng,p.lat], zoom:16.8, padding: relleno(), duration:600 }); pintar(); }

function aviso(t){ const a=document.getElementById('aviso'); a.textContent=t; a.classList.add('ver');
  clearTimeout(aviso.t); aviso.t=setTimeout(()=>a.classList.remove('ver'),1800); }

document.getElementById('ordenar').onclick = ()=>{
  const antes = resumen(orden.filter(p=>p.estado==='pendiente'));
  const hechas = orden.filter(p=>p.estado!=='pendiente');
  const ultimo = hechas.length ? hechas[hechas.length-1] : yo;
  orden = [...hechas, ...ordenar(orden.filter(p=>p.estado==='pendiente'), ultimo)];
  pintar(); encuadrar(); aviso(`Ruta ordenada: ${resumen(orden.filter(p=>p.estado==='pendiente'))} (antes ${antes.split(' ·')[0]})`);
};
// En la app este botón abre la hoja "Anotar visita"; al guardar, la base marca la parada sola.
document.getElementById('anotar').onclick = ()=>{
  const sig = orden.find(p=>p.estado==='pendiente'); if(!sig) return;
  sig.estado='visitada'; activa=null; pintar(); aviso(`Listo: ${sig.nombre} anotada`);
  const prox = orden.find(p=>p.estado==='pendiente'); if (prox) enfocar(prox.id);
};
document.getElementById('centrar').onclick = ()=>encuadrar();
document.getElementById('agarre').onclick = ()=>{ document.getElementById('hoja').classList.toggle('baja'); };
</script>
</body>
</html>
